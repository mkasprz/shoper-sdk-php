name: pr-guard

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            rest:
              - 'src/Rest/**'
      - name: Auto-close PR touching auto-generated code
        if: steps.changes.outputs.rest == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: [
                "This pull request modifies files in `src/Rest/`, which are auto-generated from the OpenAPI specification at `dreamcommerce/shoper-openapi`.",
                "",
                "PRs to auto-generated code are automatically closed. For API changes, please contact Shoper support.",
                "",
                "Community PRs are welcome to `src/ShoperClient.php`, other root helpers, `README.md`, `examples/`, and `tests/Helpers/`.",
              ].join('\n'),
            });
            await github.rest.pulls.update({
              pull_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'closed',
            });
